<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuterChat — AI Chat (Puter.js)</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2129; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --user-bg: #1f6feb; --green: #238636; --green-h: #2ea043;
    --err-bg: #3d1d1d; --err-border: #f85149; --err-text: #ffa198;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --border: #d0d7de;
    --text: #1f2328; --muted: #59636e; --accent: #0969da;
    --user-bg: #0969da;
    --err-bg: #ffebe9; --err-border: #d1242f; --err-text: #d1242f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; overflow: hidden; }

  /* ---------- sidebar ---------- */
  #sidebar { width: 264px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: margin-left .2s; }
  #sidebar.hidden { margin-left: -264px; }
  .sb-head { padding: 14px 14px 10px; display: flex; align-items: center; gap: 8px; }
  .sb-head .logo { font-size: 20px; }
  .sb-head b { font-size: 15px; }
  .sb-new { margin: 4px 14px 10px; background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 9px; font-size: 13.5px; cursor: pointer; font-weight: 600; }
  .sb-new:hover { background: var(--green-h); }
  #convo-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .convo { padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .convo:hover { background: var(--bg3); }
  .convo.active { background: var(--bg3); }
  .convo .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo .d { background: none; border: none; color: var(--err-border); cursor: pointer; visibility: hidden; font-size: 13px; }
  .convo:hover .d { visibility: visible; }
  .sb-foot { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .sb-foot a { color: var(--accent); text-decoration: none; }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
  .icon-btn { background: none; border: none; color: var(--muted); font-size: 17px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .icon-btn:hover { background: var(--bg3); color: var(--text); }
  .spacer { flex: 1; }
  select.model { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; max-width: 250px; cursor: pointer; }
  #user-chip { font-size: 12px; color: var(--muted); background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; display: none; }

  /* ---------- home (welcome) ---------- */
  #home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
  #home .hands { font-size: 52px; margin-bottom: 18px; }
  #home h2 { font-size: 30px; font-weight: 600; margin-bottom: 10px; }
  #home p.sub { color: var(--muted); font-size: 14.5px; margin-bottom: 30px; text-align: center; max-width: 520px; line-height: 1.6; }
  #suggests { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .sugg { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 13px; color: var(--text); cursor: pointer; width: 230px; text-align: left; }
  .sugg:hover { border-color: var(--accent); }
  .sugg .ico { font-size: 17px; display: block; margin-bottom: 6px; }

  /* ---------- chat ---------- */
  #chat-wrap { flex: 1; overflow-y: auto; display: none; }
  #chat { max-width: 780px; margin: 0 auto; padding: 24px 20px 10px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; gap: 12px; line-height: 1.6; font-size: 14.5px; word-break: break-word; }
  .msg .avatar { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .msg.user .avatar { background: var(--user-bg); color: #fff; }
  .msg.ai .avatar { background: var(--bg3); border: 1px solid var(--border); }
  .msg .body { flex: 1; min-width: 0; padding-top: 3px; }
  .msg.user .body { color: var(--text); white-space: pre-wrap; }
  .msg.error .body { color: var(--err-text); background: var(--err-bg); border: 1px solid var(--err-border); border-radius: 8px; padding: 10px 12px; }
  .msg.ai pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 12.5px; position: relative; }
  .msg.ai code { font-family: 'Cascadia Code', ui-monospace, monospace; font-size: 12.5px; color: var(--accent); }
  .msg.ai p { margin: 5px 0; }
  .msg.ai ul, .msg.ai ol { margin: 5px 0 5px 22px; }
  .msg.ai img { max-width: 100%; border-radius: 10px; margin-top: 10px; }
  .copy-btn { position: absolute; top: 6px; right: 6px; background: var(--bg2); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer; opacity: 0; transition: opacity .15s; }
  pre:hover .copy-btn { opacity: 1; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #typing { display: none; max-width: 780px; margin: 0 auto; padding: 0 20px 6px; color: var(--muted); font-size: 13px; }

  /* ---------- composer ---------- */
  #composer-wrap { padding: 12px 20px 18px; }
  #composer { max-width: 780px; margin: 0 auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px; }
  #composer:focus-within { border-color: var(--accent); }
  #input { width: 100%; background: none; border: none; outline: none; color: var(--text); font-size: 14.5px; resize: none; font-family: inherit; max-height: 160px; padding: 4px 6px; }
  #composer .row { display: flex; align-items: center; gap: 8px; padding: 4px 2px 0; }
  .mini-toggle { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .mini-toggle input { accent-color: var(--accent); }
  #send-btn { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--green); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #send-btn:hover { background: var(--green-h); }
  #send-btn:disabled { background: var(--bg3); color: var(--muted); cursor: default; }

  @media (max-width: 720px) {
    #sidebar { position: absolute; z-index: 10; height: 100%; box-shadow: 4px 0 20px rgba(0,0,0,.4); }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sb-head"><span class="logo">🐱</span><b>PuterChat</b></div>
  <button class="sb-new" onclick="newChat()">＋ Percakapan baru</button>
  <div id="convo-list"></div>
  <div class="sb-foot">Powered by <a href="https://puter.com" target="_blank">Puter</a> · <a href="https://github.com/antono4/MiniDevin/tree/master/puterchat" target="_blank">Source</a></div>
</aside>

<div id="main">
  <div id="topbar">
    <button class="icon-btn" onclick="toggleSidebar()" title="Sidebar">☰</button>
    <select class="model" id="model-select" title="Model AI"></select>
    <span class="spacer"></span>
    <span id="user-chip"></span>
    <button class="icon-btn" id="auth-btn" onclick="toggleAuth()" title="Masuk / Keluar">👤</button>
    <button class="icon-btn" onclick="toggleTheme()" title="Tema">🌓</button>
  </div>

  <div id="home">
    <div class="hands">🙌</div>
    <h2>Mari mulai mengobrol!</h2>
    <p class="sub">AI chat dengan 500+ model via Puter.js — tanpa API key, tanpa backend. Login dengan akun Puter Anda dan mulai bertanya, atau buat gambar dengan perintah <b>/gambar</b>.</p>
    <div id="suggests">
      <button class="sugg" onclick="useSugg(this)"><span class="ico">💡</span>Jelaskan konsep rekursi dengan contoh sederhana</button>
      <button class="sugg" onclick="useSugg(this)"><span class="ico">📝</span>Tuliskan puisi pendek tentang senja di pantai</button>
      <button class="sugg" onclick="useSugg(this)"><span class="ico">💻</span>Buatkan fungsi Python untuk cek bilangan prima</button>
      <button class="sugg" onclick="useSugg(this)"><span class="ico">🎨</span>/gambar kucing astronot mengambang di luar angkasa</button>
    </div>
  </div>

  <div id="chat-wrap"><div id="chat"></div></div>
  <div id="typing">🤖 AI sedang mengetik…</div>

  <div id="composer-wrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Ketik pesan untuk AI… (Enter = kirim)"></textarea>
      <div class="row">
        <label class="mini-toggle"><input type="checkbox" id="stream-mode" checked> ⚡ Stream</label>
        <button id="send-btn" onclick="send()" title="Kirim">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const chatWrap = document.getElementById('chat-wrap');
const home = document.getElementById('home');
const typing = document.getElementById('typing');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const streamMode = document.getElementById('stream-mode');
const convoList = document.getElementById('convo-list');

const FALLBACK_MODELS = ['gpt-5-nano', 'gpt-4o-mini', 'claude-sonnet-4', 'gemini-2.5-flash', 'deepseek-chat', 'grok-4'];
let conversations = {};   // id -> {title, messages:[{role,content}]}
let currentId = null;
let busy = false;

// ---------- helpers ----------
function md(text) {
  try {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text));
  } catch (e) {}
  const d = document.createElement('div'); d.textContent = text;
  return d.innerHTML.replace(/\n/g, '<br>');
}
function scrollChat() { chatWrap.scrollTop = chatWrap.scrollHeight; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function addMsg(role, text, isMd) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '🧑' : role === 'error' ? '⚠️' : '🐱';
  const body = document.createElement('div');
  body.className = 'body';
  if (isMd) { body.innerHTML = md(text); addCopyButtons(body); } else body.textContent = text;
  d.appendChild(av); d.appendChild(body);
  chatEl.appendChild(d); scrollChat();
  return body;
}

document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('copy-btn')) {
    const pre = e.target.closest('pre');
    if (pre) navigator.clipboard.writeText(pre.textContent.replace(/^📋 Salin/, '').trim());
    e.target.textContent = '✓';
    setTimeout(() => e.target.textContent = '📋 Salin', 1200);
  }
});
function addCopyButtons(root) {
  root.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const b = document.createElement('button');
    b.className = 'copy-btn'; b.textContent = '📋 Salin';
    pre.appendChild(b);
  });
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  typing.style.display = v ? 'block' : 'none';
}

function showHome(show) {
  home.style.display = show ? 'flex' : 'none';
  chatWrap.style.display = show ? 'none' : 'block';
}

// ---------- sidebar / theme ----------
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }
function toggleTheme() {
  const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = cur;
  localStorage.setItem('puterchat_theme', cur);
}
if (localStorage.getItem('puterchat_theme') === 'light') document.documentElement.dataset.theme = 'light';
if (window.innerWidth < 720) document.getElementById('sidebar').classList.add('hidden');

// ---------- models ----------
async function loadModels() {
  let models = FALLBACK_MODELS;
  try {
    const list = await puter.ai.listModels();
    const ids = list.map(m => (typeof m === 'string' ? m : m.id || m.name)).filter(Boolean);
    if (ids.length) models = ids;
  } catch (e) {}
  modelSelect.innerHTML = '';
  models.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    modelSelect.appendChild(o);
  });
  const saved = localStorage.getItem('puterchat_model');
  modelSelect.value = saved && models.includes(saved) ? saved : models[0];
}
modelSelect.onchange = () => localStorage.setItem('puterchat_model', modelSelect.value);

// ---------- auth ----------
async function refreshAuth() {
  try {
    if (puter.auth.isSignedIn()) {
      const u = await puter.auth.getUser();
      const chip = document.getElementById('user-chip');
      chip.style.display = '';
      chip.textContent = '👤 ' + u.username;
      document.getElementById('auth-btn').textContent = '🚪';
    } else {
      document.getElementById('user-chip').style.display = 'none';
      document.getElementById('auth-btn').textContent = '👤';
    }
  } catch (e) {}
}
async function toggleAuth() {
  try {
    if (puter.auth.isSignedIn()) await puter.auth.signOut();
    else await puter.auth.signIn();
  } catch (e) {}
  refreshAuth();
  loadConversations();
}

// ---------- conversations (KV cloud / localStorage) ----------
async function loadConversations() {
  conversations = {};
  try {
    let raw = null;
    if (puter.auth.isSignedIn()) raw = await puter.kv.get('puterchat_convos');
    else raw = localStorage.getItem('puterchat_convos');
    if (raw) conversations = JSON.parse(raw);
  } catch (e) {}
  renderConvoList();
}
async function saveConversations() {
  const data = JSON.stringify(conversations);
  try {
    if (puter.auth.isSignedIn()) await puter.kv.set('puterchat_convos', data);
    else localStorage.setItem('puterchat_convos', data);
  } catch (e) {}
}
function renderConvoList() {
  convoList.innerHTML = '';
  const ids = Object.keys(conversations).sort((a, b) => b.localeCompare(a));
  ids.slice(0, 40).forEach(id => {
    const c = conversations[id];
    const d = document.createElement('div');
    d.className = 'convo' + (id === currentId ? ' active' : '');
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = c.title || 'Percakapan';
    t.onclick = () => openChat(id);
    const del = document.createElement('button');
    del.className = 'd'; del.textContent = '🗑';
    del.onclick = async (e) => {
      e.stopPropagation();
      delete conversations[id];
      if (id === currentId) newChat();
      await saveConversations();
      renderConvoList();
    };
    d.appendChild(t); d.appendChild(del);
    convoList.appendChild(d);
  });
}
function openChat(id) {
  currentId = id;
  chatEl.innerHTML = '';
  (conversations[id].messages || []).forEach(m => addMsg(m.role, m.content, m.role !== 'user'));
  showHome(false);
  renderConvoList();
  if (window.innerWidth < 720) document.getElementById('sidebar').classList.add('hidden');
}
function newChat() {
  currentId = null;
  chatEl.innerHTML = '';
  showHome(true);
  renderConvoList();
}
function useSugg(el) {
  input.value = el.textContent.trim();
  input.focus();
}

// ---------- image generation ----------
async function generateImage(prompt) {
  setBusy(true);
  typing.textContent = '🎨 Membuat gambar…';
  try {
    const img = await puter.ai.txt2img(prompt);
    const body = addMsg('ai', '');
    body.innerHTML = '<div>🎨 <b></b></div>';
    body.querySelector('b').textContent = prompt;
    img.style.maxWidth = '100%'; img.style.borderRadius = '10px'; img.style.marginTop = '10px';
    body.appendChild(img);
    scrollChat();
    conversations[currentId].messages.push({ role: 'assistant', content: `🎨 Gambar dibuat: ${prompt}` });
  } catch (e) {
    addMsg('error', '⚠️ Gagal membuat gambar: ' + (e.message || e));
  }
  setBusy(false);
  typing.textContent = '🤖 AI sedang mengetik…';
}

// ---------- chat ----------
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  input.style.height = 'auto';

  if (!currentId) {
    currentId = uid();
    conversations[currentId] = { title: text.slice(0, 50), messages: [] };
  }
  showHome(false);
  addMsg('user', text);
  conversations[currentId].messages.push({ role: 'user', content: text });
  renderConvoList();

  if (text.startsWith('/gambar ')) {
    await generateImage(text.slice(8));
    await saveConversations();
    return;
  }

  setBusy(true);
  const model = modelSelect.value;
  const messages = conversations[currentId].messages.slice(-20).map(m => ({ role: m.role, content: m.content }));

  try {
    if (streamMode.checked) {
      const body = addMsg('ai', '');
      let full = '';
      const resp = await puter.ai.chat(messages, { model, stream: true });
      for await (const part of resp) {
        if (part?.text) {
          full += part.text;
          body.innerHTML = md(full) + '<span class="cursor"></span>';
          scrollChat();
        }
      }
      body.innerHTML = md(full);
      addCopyButtons(body);
      conversations[currentId].messages.push({ role: 'assistant', content: full });
    } else {
      const resp = await puter.ai.chat(messages, { model });
      const content = resp?.message?.content ?? resp?.text ?? String(resp);
      const textOut = Array.isArray(content) ? content.map(c => c.text || '').join('') : content;
      addMsg('ai', textOut, true);
      conversations[currentId].messages.push({ role: 'assistant', content: textOut });
    }
  } catch (e) {
    addMsg('error', '⚠️ ' + (e.message || JSON.stringify(e)));
  }
  setBusy(false);
  await saveConversations();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

// ---------- init ----------
(async () => {
  await loadModels();
  await refreshAuth();
  await loadConversations();
  showHome(true);
})();
</script>
</body>
</html>
