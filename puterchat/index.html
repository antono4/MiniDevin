<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuterChat — AI Chat (Puter.js)</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --user-bg: #1f6feb;
    --err-bg: #3d1d1d; --err-border: #f85149; --err-text: #ffa198;
  }
  [data-theme="light"] {
    --bg: #ffffff; --bg2: #f6f8fa; --border: #d0d7de; --text: #1f2328;
    --muted: #59636e; --accent: #0969da; --user-bg: #0969da;
    --err-bg: #ffebe9; --err-border: #d1242f; --err-text: #d1242f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 600; }
  .badge { font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; color: var(--muted); }
  .spacer { flex: 1; }
  .btn { background: color-mix(in srgb, var(--bg2) 50%, var(--border)); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: var(--border); }
  .btn.primary { background: #238636; border-color: #238636; color: #fff; }
  .btn.primary:hover { background: #2ea043; }
  select.btn { max-width: 230px; }

  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 10px; line-height: 1.55; word-break: break-word; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: #fff; white-space: pre-wrap; }
  .msg.ai { align-self: flex-start; background: var(--bg2); border: 1px solid var(--border); }
  .msg.error { align-self: flex-start; background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text); }
  .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12.5px; }
  .msg.ai pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 6px 0; font-size: 12.5px; position: relative; }
  .msg.ai code { font-family: 'Cascadia Code', monospace; font-size: 12.5px; color: var(--accent); }
  .msg.ai p { margin: 4px 0; }
  .msg.ai ul, .msg.ai ol { margin: 4px 0 4px 20px; }
  .msg.ai img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
  .copy-btn { position: absolute; top: 6px; right: 6px; background: var(--bg2); border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; opacity: 0; transition: opacity .15s; }
  pre:hover .copy-btn { opacity: 1; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #typing { display: none; padding: 4px 16px; color: var(--muted); font-size: 13px; flex-shrink: 0; }
  #inputbar { background: var(--bg2); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  #input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 14px; font-size: 14px; resize: none; font-family: inherit; }
  #input:focus { outline: none; border-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .toggle input { accent-color: var(--accent); }

  footer { text-align: center; padding: 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>🐱 PuterChat</h1>
  <span class="badge">Puter.js · tanpa API key</span>
  <select class="btn" id="model-select" title="Model AI"></select>
  <span class="spacer"></span>
  <span id="user-badge" class="badge" style="display:none"></span>
  <button class="btn" id="auth-btn" onclick="toggleAuth()">🔑 Masuk</button>
  <button class="btn" onclick="clearChat()">🗑 Bersihkan</button>
  <button class="btn" onclick="toggleTheme()" title="Ganti tema">🌓</button>
</header>

<div id="chat">
  <div class="msg system">Selamat datang di PuterChat — AI chat 500+ model via Puter.js, tanpa API key. Ketik pesan, atau awali dengan <b>/gambar &lt;deskripsi&gt;</b> untuk membuat gambar AI.</div>
</div>
<div id="typing">🤖 AI sedang mengetik…</div>

<div id="inputbar">
  <label class="toggle" title="Tampilkan respons token-per-token">
    <input type="checkbox" id="stream-mode" checked> ⚡ Stream
  </label>
  <textarea id="input" rows="1" placeholder="Ketik pesan… (Enter = kirim, /gambar kucing lucu = buat gambar)"></textarea>
  <button class="btn primary" id="send-btn" onclick="send()">Kirim</button>
</div>

<footer>Powered by <a href="https://puter.com" target="_blank">Puter</a> · <a href="https://github.com/antono4/MiniDevin/tree/master/puterchat" target="_blank">Source</a></footer>

<script>
const chat = document.getElementById('chat');
const typing = document.getElementById('typing');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const streamMode = document.getElementById('stream-mode');

const FALLBACK_MODELS = ['gpt-5-nano', 'gpt-4o-mini', 'claude-sonnet-4', 'gemini-2.5-flash', 'deepseek-chat', 'grok-4'];
let history = [];
let busy = false;

// ---------- helpers ----------
function md(text) {
  try {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text));
  } catch (e) {}
  const d = document.createElement('div'); d.textContent = text;
  return d.innerHTML.replace(/\n/g, '<br>');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scrollChat() { chat.scrollTop = chat.scrollHeight; }

function addMsg(cls, text, isMd) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (isMd) { d.innerHTML = md(text); addCopyButtons(d); } else d.textContent = text;
  chat.appendChild(d); scrollChat();
  return d;
}

document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('copy-btn')) {
    const pre = e.target.closest('pre');
    if (pre) navigator.clipboard.writeText(pre.textContent.replace(/^📋 Salin/, '').trim());
    e.target.textContent = '✓';
    setTimeout(() => e.target.textContent = '📋 Salin', 1200);
  }
});
function addCopyButtons(root) {
  root.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const b = document.createElement('button');
    b.className = 'copy-btn'; b.textContent = '📋 Salin';
    pre.appendChild(b);
  });
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  typing.style.display = v ? 'block' : 'none';
}

// ---------- theme ----------
function toggleTheme() {
  const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = cur;
  localStorage.setItem('puterchat_theme', cur);
}
if (localStorage.getItem('puterchat_theme') === 'light') document.documentElement.dataset.theme = 'light';

// ---------- models ----------
async function loadModels() {
  let models = FALLBACK_MODELS;
  try {
    const list = await puter.ai.listModels();
    const ids = list.map(m => (typeof m === 'string' ? m : m.id || m.name)).filter(Boolean);
    if (ids.length) models = ids;
  } catch (e) { /* pakai fallback */ }
  modelSelect.innerHTML = '';
  models.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = '🤖 ' + m;
    modelSelect.appendChild(o);
  });
  const saved = localStorage.getItem('puterchat_model');
  modelSelect.value = saved && models.includes(saved) ? saved : models[0];
}
modelSelect.onchange = () => localStorage.setItem('puterchat_model', modelSelect.value);

// ---------- auth ----------
async function refreshAuth() {
  try {
    if (puter.auth.isSignedIn()) {
      const u = await puter.auth.getUser();
      document.getElementById('user-badge').style.display = '';
      document.getElementById('user-badge').textContent = '👤 ' + u.username;
      document.getElementById('auth-btn').textContent = '🚪 Keluar';
    } else {
      document.getElementById('user-badge').style.display = 'none';
      document.getElementById('auth-btn').textContent = '🔑 Masuk';
    }
  } catch (e) {}
}
async function toggleAuth() {
  try {
    if (puter.auth.isSignedIn()) await puter.auth.signOut();
    else await puter.auth.signIn();
  } catch (e) {}
  refreshAuth();
  loadHistory();
}

// ---------- history (KV store, per-user cloud) ----------
async function loadHistory() {
  history = [];
  chat.querySelectorAll('.msg:not(.system)').forEach(n => n.remove());
  try {
    if (puter.auth.isSignedIn()) {
      const saved = await puter.kv.get('puterchat_history');
      if (saved) history = JSON.parse(saved);
    } else {
      history = JSON.parse(localStorage.getItem('puterchat_history') || '[]');
    }
  } catch (e) {}
  history.slice(-50).forEach(m => {
    if (m.role === 'user') addMsg('user', m.content);
    else if (m.role === 'assistant') addMsg('ai', m.content, true);
  });
}
async function saveHistory() {
  const data = JSON.stringify(history.slice(-50));
  try {
    if (puter.auth.isSignedIn()) await puter.kv.set('puterchat_history', data);
    else localStorage.setItem('puterchat_history', data);
  } catch (e) {}
}
function clearChat() {
  history = [];
  chat.querySelectorAll('.msg:not(.system)').forEach(n => n.remove());
  saveHistory();
}

// ---------- image generation ----------
async function generateImage(prompt) {
  setBusy(true);
  typing.textContent = '🎨 Membuat gambar…';
  try {
    const img = await puter.ai.txt2img(prompt);
    const d = document.createElement('div');
    d.className = 'msg ai';
    d.innerHTML = '<div>🎨 <b></b></div>';
    d.querySelector('b').textContent = prompt;
    img.style.maxWidth = '100%';
    img.style.borderRadius = '8px';
    img.style.marginTop = '8px';
    d.appendChild(img);
    chat.appendChild(d); scrollChat();
    history.push({ role: 'assistant', content: `🎨 Gambar dibuat: ${prompt}` });
    saveHistory();
  } catch (e) {
    addMsg('error', '⚠️ Gagal membuat gambar: ' + (e.message || e));
  }
  setBusy(false);
  typing.textContent = '🤖 AI sedang mengetik…';
}

// ---------- chat ----------
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  input.style.height = 'auto';

  if (text.startsWith('/gambar ')) {
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    await generateImage(text.slice(8));
    return;
  }

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  setBusy(true);

  const model = modelSelect.value;
  const messages = history.slice(-20).map(m => ({ role: m.role, content: m.content }));

  try {
    if (streamMode.checked) {
      const bubble = addMsg('ai', '');
      let full = '';
      const resp = await puter.ai.chat(messages, { model, stream: true });
      for await (const part of resp) {
        if (part?.text) {
          full += part.text;
          bubble.innerHTML = md(full) + '<span class="cursor"></span>';
          scrollChat();
        }
      }
      bubble.innerHTML = md(full);
      addCopyButtons(bubble);
      history.push({ role: 'assistant', content: full });
    } else {
      const resp = await puter.ai.chat(messages, { model });
      const content = resp?.message?.content ?? resp?.text ?? String(resp);
      const textOut = Array.isArray(content) ? content.map(c => c.text || '').join('') : content;
      addMsg('ai', textOut, true);
      history.push({ role: 'assistant', content: textOut });
    }
  } catch (e) {
    addMsg('error', '⚠️ ' + (e.message || JSON.stringify(e)));
  }
  setBusy(false);
  saveHistory();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

// ---------- init ----------
(async () => {
  await loadModels();
  await refreshAuth();
  await loadHistory();
})();
</script>
</body>
</html>
